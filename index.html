<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my Valentine?</title>

<style>
body {
    background-color: #fdf2f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* Confetti */
.confetti {
    position: fixed;
    top: -10px;
    width: 10px;
    height: 10px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

#container {
    background: white;
    padding: 3rem;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 400px;
    width: 90%;
    position: relative;
    z-index: 5;
}

.icon {
    font-size: 80px;
    margin-bottom: 20px;
}

h1 {
    color: #333;
    font-size: 1.8rem;
    margin-bottom: 2rem;
}

.btn-group {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    height: 60px;
    position: relative;
}

button {
    padding: 12px 25px;
    font-size: 1rem;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#yesBtn {
    background-color: #f43f5e;
    color: white;
}

#noBtn {
    background-color: #94a3b8;
    color: white;
    position: absolute;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div id="container">
    <div id="main-content">
        <div class="icon">😻❤️</div>
        <h1>Sahithi, will you be my Valentine?</h1>

        <div class="btn-group" id="buttonArea">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>

        <p style="margin-top: 20px; color: #64748b; font-size: 0.8rem;">
            "No" seems a bit shy 😈
        </p>
    </div>

    <div id="success-content" class="hidden">
        <div class="icon">🎉🎊</div>
        <h1 style="font-size: 3rem;">YAY!</h1>
        <p>I knew you'd say yes! 💖</p>
    </div>
</div>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const mainContent = document.getElementById('main-content');
const successContent = document.getElementById('success-content');
const area = document.getElementById('buttonArea');

/* Hearts */
function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerText = '💖';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 600);

/* Confetti */
function createConfetti() {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.backgroundColor =
        ['#f43f5e','#facc15','#22c55e','#3b82f6'][Math.floor(Math.random()*4)];
    confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 5000);
}

/* NO button runs away */
function moveNoButton() {
    const maxX = area.clientWidth - noBtn.offsetWidth;
    const maxY = area.clientHeight - noBtn.offsetHeight;
    noBtn.style.left = Math.random() * maxX + 'px';
    noBtn.style.top = Math.random() * maxY + 'px';
}

document.addEventListener('mousemove', (e) => {
    const rect = noBtn.getBoundingClientRect();
    const btnX = rect.left + rect.width / 2;
    const btnY = rect.top + rect.height / 2;
    const distance = Math.hypot(e.clientX - btnX, e.clientY - btnY);
    if (distance < 120) moveNoButton();
});

noBtn.addEventListener('touchstart', moveNoButton);

/* YES */
yesBtn.addEventListener('click', () => {
    mainContent.classList.add('hidden');
    successContent.classList.remove('hidden');
    noBtn.style.display = 'none';

    setInterval(createHeart, 300);
    for (let i = 0; i < 50; i++) createConfetti();
});

/* Initial */
moveNoButton();
</script>

</body>
</html>
